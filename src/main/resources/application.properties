# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=Travel Management System

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:travel_management_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10

# Logging Configuration
logging.level.root=INFO
logging.level.com.travelmanagement=DEBUG

# SpringDoc OpenAPI Configuration (Swagger UI)
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Startup Configuration
spring.startup.initial-attempts=3
