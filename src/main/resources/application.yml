spring:
  application:
    name: Travel Management System

  datasource:
    url: jdbc:h2:mem:travel_management_db
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.travelmanagement: DEBUG

springdoc:
  swagger-ui:
    doc-expansion: list
    operations-sorter: method
    tags-sorter: alpha
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
