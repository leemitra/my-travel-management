version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: travel_management_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: travel_management_db
      MYSQL_USER: traveler
      MYSQL_PASSWORD: traveler123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - travel_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:

networks:
  travel_network:
    driver: bridge
